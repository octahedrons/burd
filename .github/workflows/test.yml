name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    services:
      redis:
        image: redis
        ports:
        - 6379:6379
        options: --entrypoint redis-server
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - run: bin/test
      env:
        REDIS_URL: "redis://localhost:${{ job.services.redis.ports[6379] }}"
